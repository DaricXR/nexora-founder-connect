name: Nexora opportunity monitor
on:
  schedule:
    - cron: '23 3 * * *' # 08:23 in Pakistan (UTC+5)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexora-opportunity-monitor
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan and store findings
        run: python monitor/monitor.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXORA_USER_ID: ${{ secrets.NEXORA_USER_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
